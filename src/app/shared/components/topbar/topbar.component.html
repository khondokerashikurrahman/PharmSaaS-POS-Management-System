<header class="topbar">

  <!-- =========================
       SEARCH
  ========================== -->
  <div class="search-area">

    <div class="search-box">

      <span class="search-icon">
        <i class="bi bi-search"></i>
      </span>

      <input
        type="text"
        placeholder="Search medicines, invoices, customers..."
      />

      <span class="shortcut">
        ⌘ K
      </span>

    </div>

  </div>


  <!-- =========================
       RIGHT SIDE
  ========================== -->
  <div class="topbar-actions">


    <!-- =========================
         CURRENT TENANT
    ========================== -->
    <div
      class="tenant-info"
      *ngIf="isTenantUser() && currentTenant"
    >

      <div class="tenant-icon">
        <i class="bi bi-building"></i>
      </div>

      <div class="tenant-details">

        <strong>
          {{ currentTenant.name }}
        </strong>

        <span>
          {{ currentTenant.plan }} Plan
        </span>

      </div>

    </div>


    <!-- =========================
         SUPER ADMIN
    ========================== -->
    <div
      class="tenant-info admin-context"
      *ngIf="isSuperAdmin()"
    >

      <div class="tenant-icon admin-icon">
        <i class="bi bi-shield-lock"></i>
      </div>

      <div class="tenant-details">

        <strong>
          Platform Administration
        </strong>

        <span>
          Super Admin
        </span>

      </div>

    </div>


    <!-- =========================
         NOTIFICATION
    ========================== -->
    <button
      type="button"
      class="action-btn"
      title="Notifications"
      aria-label="Notifications"
    >

      <i class="bi bi-bell"></i>

      <span class="notification-dot"></span>

    </button>


    <!-- =========================
         HELP
    ========================== -->
    <button
      type="button"
      class="action-btn"
      title="Help & Support"
      aria-label="Help and Support"
    >

      <i class="bi bi-question-circle"></i>

    </button>


    <!-- =========================
         PROFILE
    ========================== -->
    <div class="profile">

      <!-- Avatar -->
      <div class="profile-avatar">

        {{ getUserInitial() }}

      </div>


      <!-- User Info -->
      <div class="profile-info">

        <strong>
          {{ currentUser?.name || 'User' }}
        </strong>

        <span>
          {{ getRoleLabel() }}
        </span>

      </div>


      <!-- Dropdown Button -->
      <button
        type="button"
        class="dropdown-trigger"
        (click)="toggleDropdown()"
        [attr.aria-expanded]="isDropdownOpen"
        aria-label="User menu"
      >

        <i
          class="bi"
          [ngClass]="
            isDropdownOpen
              ? 'bi-chevron-up'
              : 'bi-chevron-down'
          "
        ></i>

      </button>


      <!-- Dropdown -->
      <div
        class="dropdown-menu"
        *ngIf="isDropdownOpen"
      >

        <button
          type="button"
          class="dropdown-item"
        >

          <i class="bi bi-person"></i>

          <span>
            Profile
          </span>

        </button>


        <button
          type="button"
          class="dropdown-item"
        >

          <i class="bi bi-gear"></i>

          <span>
            Settings
          </span>

        </button>


        <div class="dropdown-divider"></div>


        <button
          type="button"
          class="dropdown-item logout-item"
          (click)="logout()"
        >

          <i class="bi bi-box-arrow-right"></i>

          <span>
            Logout
          </span>

        </button>

      </div>

    </div>

  </div>

</header>
