<div class="receipt-overlay" *ngIf="visible && receipt">
  <div class="receipt-modal jasper-invoice-modal">

    <div class="receipt-header">
      <div class="receipt-status">
        <span class="success-icon"><i class="bi bi-check-lg"></i></span>
        <div>
          <h2>Sale Completed</h2>
          <p>JasperReports Invoice — {{ receipt.invoiceNumber }}</p>
        </div>
      </div>

      <button type="button" class="close-btn" (click)="close()" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="jasper-preview-container">
      <div class="jasper-loading" *ngIf="loadingInvoice">
        <i class="bi bi-arrow-repeat"></i>
        <p>Loading Jasper invoice...</p>
      </div>

      <div class="jasper-error" *ngIf="invoiceError && !loadingInvoice">
        <i class="bi bi-exclamation-triangle"></i>
        <p>{{ invoiceError }}</p>
        <button type="button" class="primary-btn" (click)="loadInvoiceForRetry()">
          Retry
        </button>
      </div>

      <iframe
        *ngIf="pdfPreviewUrl && !loadingInvoice"
        class="jasper-pdf-frame"
        [src]="pdfPreviewUrl"
        title="JasperReports Invoice PDF">
      </iframe>
    </div>

    <div class="receipt-actions">
      <button type="button" class="secondary-btn" (click)="close()">
        <i class="bi bi-x-circle"></i> Close
      </button>

      <button
        type="button"
        class="secondary-btn"
        (click)="printInvoice()"
        [disabled]="!pdfPreviewUrl">
        <i class="bi bi-printer"></i> Print PDF
      </button>

      <button
        type="button"
        class="primary-btn"
        (click)="downloadInvoice()"
        [disabled]="!pdfPreviewUrl || downloadingInvoice">
        <i class="bi bi-download"></i>
        {{ downloadingInvoice ? 'Downloading...' : 'Download PDF' }}
      </button>
    </div>

  </div>
</div>
