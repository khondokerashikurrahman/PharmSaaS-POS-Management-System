<div class="customer-selector">

  <div class="customer-label">
    <span>Customer</span>

    <button
      type="button"
      class="add-customer-btn">

      <i class="bi bi-plus"></i>

      Add Customer

    </button>
  </div>


  <div class="customer-select-wrapper">

    <button
      type="button"
      class="customer-select"
      (click)="openCustomerList()">

      <div class="selected-customer">

        <div class="customer-icon">
          <i class="bi bi-person"></i>
        </div>

        <div class="customer-info">

          <strong>
            {{ selectedCustomerName }}
          </strong>

          <small>
            {{
              selectedCustomerName === 'Walk-in Customer'
                ? 'No customer account'
                : 'Registered customer'
            }}
          </small>

        </div>

      </div>

      <i
        class="bi"
        [class.bi-chevron-down]="!showCustomerList"
        [class.bi-chevron-up]="showCustomerList">
      </i>

    </button>


    <div
      class="customer-dropdown"
      *ngIf="showCustomerList">

      <div class="customer-search">

        <i class="bi bi-search"></i>

        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search customer..."
          autocomplete="off"
        />

        <button
          type="button"
          *ngIf="searchTerm"
          (click)="clearSearch()">

          <i class="bi bi-x"></i>

        </button>

      </div>


      <div class="customer-list">

        <button
          type="button"
          class="customer-option"
          *ngFor="let customer of filteredCustomers"
          (click)="selectCustomer(customer)">

          <div class="customer-option-icon">

            <i class="bi bi-person"></i>

          </div>


          <div class="customer-option-info">

            <strong>
              {{ customer.name }}
            </strong>

            <span>
              {{ customer.phone }}
            </span>

          </div>


          <i
            class="bi bi-check2"
            *ngIf="selectedCustomerName === customer.name">
          </i>

        </button>


        <div
          class="empty-customer"
          *ngIf="filteredCustomers.length === 0">

          <i class="bi bi-person-x"></i>

          <span>
            No customer found
          </span>

        </div>

      </div>

    </div>

  </div>

</div>
